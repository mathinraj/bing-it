<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 – Page Not Found | bing it</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/scrollcraft.css">
  <link rel="stylesheet" href="/bingit.css">
  <style>
    .nf { min-height: 100vh; padding: calc(var(--top) + 24px) calc(var(--inset) + 28px) 10vh; background: #fff; }
    .nf__bar { max-width: 720px; }
    .nf__box { width: min(640px, 100%); height: 46px; font-size: 16px; }
    .nf__body { max-width: 720px; margin-top: 10vh; }
    .nf .nf__code { margin: 0; max-width: none; color: var(--ink); font: 800 clamp(7rem, 20vw, 15rem)/0.82 var(--sc-font-display); letter-spacing: -0.07em; }
    .nf__code span { color: #E6CF00; }
    .nf h1 { margin: 28px 0 10px; font: 700 clamp(1.6rem, 2.6vw, 2.2rem)/1.08 var(--sc-font-display); letter-spacing: -0.025em; text-wrap: balance; }
    .nf p { margin: 0; max-width: 50ch; font-size: 16px; color: var(--sc-ink-soft); }
    .nf p code { font: 500 14px var(--sc-font-text); padding: 2px 6px; border-radius: 5px; background: #F1F0EB; color: var(--ink); overflow-wrap: anywhere; }
    .nf__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .nf .btn--ink { background: var(--ink); color: var(--brand); }
    .nf .btn--soft { background: #F1F0EB; color: var(--ink); }
    @media (hover: hover) and (pointer: fine) { .nf .btn--ink:hover { background: #2A2934; } .nf .btn--soft:hover { background: #E7E5DE; } }
    .nf .nf__foot { margin-top: 8vh; font-size: 13px; }
    .nf__foot a { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <div class="desk" aria-hidden="true"></div>

  <header class="chrome">
    <div class="chrome__strip">
      <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
      <nav class="tabs" aria-label="Site" tabindex="-1">
        <a class="tab" href="/"><svg class="tab__ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="#16151d"/><path d="M7 12l3 3 7-7" stroke="#ffe500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span class="tab__t">bing it</span></a>
        <a class="tab" href="#" aria-current="page"><svg class="tab__ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="tab__t">Page not found</span></a>
      </nav>
    </div>
    <div class="chrome__bar">
      <div class="omnibox"><svg class="omnibox__ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="omnibox__url" id="nf-url">bingit.vercel.app</span></div>
      <a class="ext" href="/" aria-label="bing it home"><svg class="ext__ic" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="26" fill="#FFE500"/><path d="M36 66L52 82L92 42" stroke="#16151d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></a>
    </div>
  </header>

  <main class="nf">
    <div class="nf__bar">
      <div class="sbox nf__box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="sbox__text" id="nf-q">this page</span></div>
    </div>
    <div class="nf__body">
      <p class="nf__code" aria-hidden="true">4<span>0</span>4</p>
      <h1>We searched. Nothing came back.</h1>
      <p>There's no page at <code id="nf-path">this address</code>. It may have moved, or the link has a typo.</p>
      <div class="nf__actions">
        <a class="btn btn--ink" href="/">Go to bing it</a>
        <a class="btn btn--soft" href="/feedback">Send feedback</a>
      </div>
      <p class="nf__foot">Built by <a href="https://mathinraj.is-a.dev" target="_blank" rel="noopener">Mathinraj</a></p>
    </div>
  </main>

  <script>
    (function () {
      var path = location.pathname + location.search;
      document.getElementById('nf-url').textContent = location.host + path;
      var q = location.pathname.replace(/^\//, '');
      try { q = decodeURIComponent(q); } catch (e) {}
      document.getElementById('nf-q').textContent = q || 'this page';
      document.getElementById('nf-path').textContent = path;
    })();
  </script>
</body>
</html>
